<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <title>mEditor</title>
  <link rel="stylesheet" href="../shared/theme.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="M14.54 21.69a.5.5 0 0 0 .94-.02l6.5-19a.5.5 0 0 0-.64-.64l-19 6.5a.5.5 0 0 0-.02.94l7.93 3.18a2 2 0 0 1 1.11 1.11z"/><path d="m21.85 2.15-10.94 10.94"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="i-external" viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
    <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.09-3.09a2 2 0 0 0-2.82 0L6 21"/></symbol>
    <symbol id="i-ban" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m4.9 4.9 14.2 14.2"/></symbol>
  </svg>

  <header class="appbar">
    <img class="appbar__logo" src="../../icons/logo.png" alt="" width="30" height="30" />
    <div class="appbar__titles">
      <div class="appbar__name">mEditor</div>
      <div class="appbar__sub">News clipper</div>
    </div>
    <button class="icon-btn" id="refresh" title="Re-scan this page" aria-label="Re-scan this page"><svg><use href="#i-refresh"/></svg></button>
    <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings"><svg><use href="#i-gear"/></svg></button>
  </header>

  <main id="main" aria-live="polite">
    <!-- Loading skeleton -->
    <section id="view-loading" class="view">
      <div class="verdict skeleton-block" style="height:64px"></div>
      <div class="card">
        <div class="skeleton-block" style="aspect-ratio:2.25/1"></div>
        <div style="padding:14px 16px 16px">
          <div class="skeleton-line" style="width:35%"></div>
          <div class="skeleton-line" style="width:92%;height:14px"></div>
          <div class="skeleton-line" style="width:70%;height:14px"></div>
          <div class="skeleton-line" style="width:50%"></div>
        </div>
      </div>
    </section>

    <!-- Page we can't read (chrome://, Web Store, PDF viewer…) -->
    <section id="view-unsupported" class="view empty" hidden>
      <div class="empty__icon"><svg><use href="#i-ban"/></svg></div>
      <h2>Can't read this page</h2>
      <p id="unsupported-reason">Chrome doesn't let extensions run on this kind of page. Open a news article and try again.</p>
    </section>

    <!-- Result -->
    <section id="view-result" class="view" hidden>
      <div class="verdict" id="verdict" data-verdict="none">
        <button class="verdict__head" id="verdict-toggle" aria-expanded="false" aria-controls="signals">
          <span class="ring" aria-hidden="true">
            <svg viewBox="0 0 36 36"><circle class="ring__track" cx="18" cy="18" r="15.5"/><circle class="ring__value" id="ring-value" cx="18" cy="18" r="15.5"/></svg>
            <span class="ring__label" id="ring-label">0</span>
          </span>
          <span class="verdict__text">
            <span class="verdict__title" id="verdict-title">Checking…</span>
            <span class="verdict__sub" id="verdict-sub"></span>
          </span>
          <svg class="verdict__chev"><use href="#i-chevron"/></svg>
        </button>
        <ul class="signals" id="signals" hidden></ul>
      </div>

      <article class="card preview" id="preview">
        <div class="preview__media" id="preview-media">
          <img id="preview-img" alt="" referrerpolicy="no-referrer" hidden />
          <div class="preview__placeholder" id="preview-placeholder"><svg><use href="#i-image"/></svg><span>No image found</span></div>
        </div>
        <div class="preview__body">
          <div class="preview__site">
            <img id="preview-favicon" alt="" width="16" height="16" referrerpolicy="no-referrer" hidden />
            <span id="preview-site"></span>
          </div>
          <h1 class="preview__title" id="preview-title"></h1>
          <p class="preview__meta" id="preview-meta"></p>
        </div>
      </article>

      <div class="tabs" role="tablist">
        <button role="tab" class="tab" id="tab-fields" aria-selected="true" aria-controls="panel-fields">Fields</button>
        <button role="tab" class="tab" id="tab-json" aria-selected="false" aria-controls="panel-json">Data</button>
        <span class="tabs__pill" aria-hidden="true"></span>
      </div>

      <div class="panel" id="panel-fields" role="tabpanel">
        <label class="field">
          <span class="field__label">Title</span>
          <textarea id="f-title" rows="2" spellcheck="true"></textarea>
        </label>
        <label class="field">
          <span class="field__label">URL <a class="field__link" id="f-url-open" target="_blank" rel="noopener noreferrer" title="Open URL"><svg><use href="#i-external"/></svg></a></span>
          <input id="f-url" type="url" spellcheck="false" />
        </label>
        <label class="field">
          <span class="field__label">Image URL</span>
          <span class="field__row">
            <span class="thumb" id="f-image-thumb"><img alt="" referrerpolicy="no-referrer" hidden /></span>
            <input id="f-image" type="url" spellcheck="false" placeholder="https://…" />
          </span>
        </label>
        <label class="field">
          <span class="field__label">Published <span class="field__hint" id="f-date-iso"></span></span>
          <input id="f-date" type="datetime-local" step="60" />
        </label>
        <div class="field">
          <span class="field__label" id="authors-label">Authors</span>
          <div class="chips" id="f-authors" aria-labelledby="authors-label">
            <input id="f-author-input" placeholder="Add author…" aria-label="Add author" />
          </div>
        </div>
      </div>

      <div class="panel" id="panel-json" role="tabpanel" hidden>
        <div class="code">
          <div class="code__bar">
            <span><span class="code__dot"></span>What mEditor saves</span>
            <button class="code__copy" id="copy-json"><svg><use href="#i-copy"/></svg><span>Copy</span></button>
          </div>
          <pre id="json-view"></pre>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer" id="footer" hidden>
    <button class="send" id="send" data-state="idle">
      <span class="send__icon"><svg><use href="#i-send"/></svg></span>
      <span class="send__label" id="send-label">Send to mEditor</span>
    </button>
    <div class="footer__note" id="footer-note"></div>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
